[project]
name = "prvosm"
version = "1.0.0"
description = "Small library for reading from the OSM API"
readme = "README.md"
authors = [
    { name = "Preben Vangberg", email = "prv21fgt@bangor.ac.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-xml>=2.21.1",
    "requests>=2.34.2",
    "shapely>=2.1.2",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "mkdocstrings-python>=2.0.7",
    "zensical>=0.0.57",
]
testing = [
    "pytest>=9.1.1",
]
